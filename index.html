<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Xpnd.">
<meta name="theme-color" content="#F5F1E8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Xpnd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E8;--bg2:#FBF8F1;--denim:#3B5F8A;--denim-dark:#2C4A6E;--denim-light:#6B8AB0;--denim-faint:#E2E8F1;--ink:#1A2332;--ink-soft:#5A6678;--line:#D9D2C1;--line-soft:#E8E3D5;--success:#4A7C59;--danger:#B85450;--shadow:0 4px 20px rgba(59,95,138,.08);--shadow2:0 8px 30px rgba(59,95,138,.15);--r:16px;--r2:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Heebo',-apple-system,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}
.app{flex:1;max-width:480px;margin:0 auto;width:100%;padding:24px 20px 40px;display:flex;flex-direction:column;gap:24px}
.header{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px}
.logo{font-family:'Fraunces',Georgia,serif;font-size:56px;font-weight:600;color:var(--denim);letter-spacing:-2.5px;line-height:1;font-variation-settings:"opsz" 144}
.tag{font-size:11px;color:var(--ink-soft);letter-spacing:4px;text-transform:uppercase;margin-top:6px}
.amount-sec{background:var(--bg2);border-radius:var(--r);padding:28px 24px 24px;box-shadow:var(--shadow);border:1px solid var(--line-soft)}
.amount-disp{text-align:center;margin-bottom:18px}
.amount-val{font-family:'Fraunces',Georgia,serif;font-size:60px;font-weight:500;color:var(--ink);line-height:1;letter-spacing:-2px;direction:ltr;font-variation-settings:"opsz" 144}
.amount-val.empty{color:var(--line)}
.cur-sym{font-size:32px;color:var(--denim);margin-inline-end:8px;font-weight:400}
.amount-conv{margin-top:10px;font-size:13px;color:var(--ink-soft);min-height:18px;direction:ltr}
.amount-conv span{margin:0 6px}
.cur-row{display:flex;gap:6px;justify-content:center;background:var(--denim-faint);padding:4px;border-radius:999px}
.cur-pill{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .2s;font-family:'Heebo',sans-serif}
.cur-pill.active{background:var(--denim);color:var(--bg);box-shadow:0 2px 8px rgba(59,95,138,.25)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{background:var(--bg2);border:1px solid var(--line-soft);border-radius:var(--r2);padding:18px 0;font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:500;color:var(--ink);cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(59,95,138,.04);font-variation-settings:"opsz" 144}
.key:active{background:var(--denim-faint);transform:scale(.96)}
.key-act{color:var(--denim);font-family:'Heebo',sans-serif;font-size:22px;font-weight:600}
.label{font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;padding-inline-start:4px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat{background:var(--bg2);border:1.5px solid var(--line-soft);border-radius:var(--r2);padding:13px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s;font-family:'Heebo',sans-serif;font-size:14px;font-weight:500;color:var(--ink);text-align:right}
.cat-ic{font-size:20px;line-height:1}
.cat.active{background:var(--denim);border-color:var(--denim);color:var(--bg);box-shadow:var(--shadow)}
.date-wrap{background:var(--bg2);border:1px solid var(--line-soft);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.date-lab{font-size:14px;color:var(--ink-soft)}
.date-disp{font-size:15px;font-weight:500;color:var(--ink);direction:ltr;cursor:pointer}
.desc{width:100%;background:var(--bg2);border:1px solid var(--line-soft);border-radius:var(--r2);padding:14px 16px;font-family:'Heebo',sans-serif;font-size:15px;color:var(--ink);text-align:right}
.desc::placeholder{color:var(--ink-soft);opacity:.7}
.desc:focus{outline:none;border-color:var(--denim-light)}
.launch{width:100%;background:var(--denim);color:var(--bg);border:none;border-radius:var(--r);padding:20px;font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-.5px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow2);font-variation-settings:"opsz" 144;display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
.launch:active{transform:translateY(1px);background:var(--denim-dark)}
.launch:disabled{background:var(--line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
.arrow{font-size:24px;line-height:0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-family:'Heebo',sans-serif;font-size:14px;font-weight:500;box-shadow:var(--shadow2);opacity:0;transition:all .3s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.footer{text-align:center;padding:8px 0}
.settings-link{font-family:'Heebo',sans-serif;font-size:12px;color:var(--ink-soft);text-decoration:none;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(26,35,50,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px calc(40px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
.overlay.show .modal{transform:translateY(0)}
.handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 20px}
.mtitle{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;color:var(--denim);margin-bottom:6px;text-align:center;letter-spacing:-1px}
.msub{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:24px}
.fg{margin-bottom:18px}
.flab{font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
.finp{width:100%;background:var(--bg2);border:1px solid var(--line-soft);border-radius:var(--r2);padding:14px 16px;font-family:'Heebo',sans-serif;font-size:14px;color:var(--ink);direction:ltr;text-align:left}
.finp:focus{outline:none;border-color:var(--denim-light)}
.mbtn{width:100%;background:var(--denim);color:var(--bg);border:none;border-radius:var(--r2);padding:16px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.mhelp{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-top:16px;padding:14px;background:var(--denim-faint);border-radius:var(--r2)}
.date-native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="logo">Xpnd.</div><div class="tag">Track every baht</div></header>
<section class="amount-sec">
<div class="amount-disp">
<div class="amount-val empty" id="amountDisplay"><span class="cur-sym" id="currencySymbol">฿</span><span id="amountNumber">0</span></div>
<div class="amount-conv" id="amountConverted"></div>
</div>
<div class="cur-row" id="currencyRow">
<button class="cur-pill active" data-currency="THB">฿ באט</button>
<button class="cur-pill" data-currency="ILS">₪ שקל</button>
<button class="cur-pill" data-currency="USD">$ דולר</button>
<button class="cur-pill" data-currency="EUR">€ יורו</button>
</div>
</section>
<section><div class="keypad" id="keypad">
<button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
<button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
<button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
<button class="key key-act" data-key=".">.</button><button class="key" data-key="0">0</button><button class="key key-act" data-key="del">⌫</button>
</div></section>
<section><div class="label">קטגוריה</div><div class="cats" id="categories">
<button class="cat" data-cat="אוכל ושתייה"><span class="cat-ic">🍜</span><span>אוכל ושתייה</span></button>
<button class="cat" data-cat="תחבורה"><span class="cat-ic">🛵</span><span>תחבורה</span></button>
<button class="cat" data-cat="קניות"><span class="cat-ic">🛍️</span><span>קניות</span></button>
<button class="cat" data-cat="בילויים וחברה"><span class="cat-ic">🎉</span><span>בילויים וחברה</span></button>
<button class="cat" data-cat="מיסים וחובות"><span class="cat-ic">📋</span><span>מיסים וחובות</span></button>
<button class="cat" data-cat="שונות יומי"><span class="cat-ic">✨</span><span>שונות יומי</span></button>
</div></section>
<section><div class="label">תיאור (אופציונלי)</div><input type="text" class="desc" id="descInput" placeholder="פירוט ההוצאה..." maxlength="100"></section>
<section><div class="label">תאריך</div>
<div class="date-wrap" id="dateWrap"><span class="date-lab">📅</span><span class="date-disp" id="dateDisplay"></span><input type="date" id="dateInput" class="date-native"></div>
</section>
<button class="launch" id="launchBtn" disabled><span>Launch Expense</span><span class="arrow">→</span></button>
<footer class="footer"><a href="#" class="settings-link" id="settingsLink">⚙ הגדרות</a></footer>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="settingsModal"><div class="modal">
<div class="handle"></div>
<div class="mtitle">הגדרות</div>
<div class="msub">חיבור לטבלת התזרים שלך</div>
<div class="fg"><div class="flab">Google Apps Script URL</div><input type="text" class="finp" id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec"></div>
<div class="fg"><div class="flab">שערי מטבע</div>
<input type="text" class="finp" id="rateThbIls" placeholder="THB → ILS" inputmode="decimal">
<input type="text" class="finp" id="rateUsdIls" placeholder="USD → ILS" inputmode="decimal" style="margin-top:8px">
<input type="text" class="finp" id="rateEurIls" placeholder="EUR → ILS" inputmode="decimal" style="margin-top:8px">
</div>
<button class="mbtn" id="saveSettings">שמור</button>
<div class="mhelp">בכל פעם שאני שולח הוצאה, היא נכתבת לטבלת הגוגל שיטס שלך.</div>
</div></div>
<script>
const state={amount:'',currency:'THB',category:null,description:'',date:new Date().toISOString().slice(0,10),settings:{webhookUrl:'',rates:{THB_ILS:0.089,USD_ILS:2.89,EUR_ILS:3.95}}};
const SYM={THB:'฿',ILS:'₪',USD:'$',EUR:'€'};
const $=id=>document.getElementById(id);
const amountNumber=$('amountNumber'),amountDisplay=$('amountDisplay'),currencySymbol=$('currencySymbol'),amountConverted=$('amountConverted'),launchBtn=$('launchBtn'),descInput=$('descInput'),dateInput=$('dateInput'),dateDisplay=$('dateDisplay'),dateWrap=$('dateWrap'),toast=$('toast'),settingsModal=$('settingsModal');

function loadSettings(){const s=localStorage.getItem('xpnd_settings');if(s){try{const p=JSON.parse(s);state.settings={...state.settings,...p};state.settings.rates={...state.settings.rates,...(p.rates||{})}}catch(e){}}}
function saveSettingsToStorage(){localStorage.setItem('xpnd_settings',JSON.stringify(state.settings))}
function formatAmount(n){if(n===''||n==null)return'0';const s=String(n),p=s.split('.'),f=Number(p[0]).toLocaleString('en-US');return p[1]!==undefined?f+'.'+p[1]:f}
function getNumericAmount(){return parseFloat(state.amount)||0}
function updateAmountDisplay(){amountNumber.textContent=formatAmount(state.amount||'0');currencySymbol.textContent=SYM[state.currency];if(state.amount&&parseFloat(state.amount)>0)amountDisplay.classList.remove('empty');else amountDisplay.classList.add('empty');updateConverted();updateLaunchState()}
function toIls(a,c){const r=state.settings.rates;if(c==='ILS')return a;if(c==='THB')return a*r.THB_ILS;if(c==='USD')return a*r.USD_ILS;if(c==='EUR')return a*r.EUR_ILS;return a}
function fromIls(a,c){const r=state.settings.rates;if(c==='ILS')return a;if(c==='THB')return a/r.THB_ILS;if(c==='USD')return a/r.USD_ILS;if(c==='EUR')return a/r.EUR_ILS;return a}
function updateConverted(){const a=getNumericAmount();if(!a){amountConverted.textContent='';return}const ils=toIls(a,state.currency),usd=ils/state.settings.rates.USD_ILS,thb=ils/state.settings.rates.THB_ILS,p=[];if(state.currency!=='ILS')p.push('₪'+ils.toFixed(2));if(state.currency!=='USD')p.push('$'+usd.toFixed(2));if(state.currency!=='THB')p.push('฿'+thb.toFixed(0));amountConverted.innerHTML=p.map(x=>'<span>'+x+'</span>').join('')}
function handleKey(k){if(k==='del')state.amount=state.amount.slice(0,-1);else if(k==='.'){if(!state.amount.includes('.'))state.amount=(state.amount||'0')+'.'}else{if(state.amount.includes('.')){const d=state.amount.split('.')[1];if(d&&d.length>=2)return}if(state.amount==='0'&&k!=='.')state.amount=k;else if(state.amount.length<12)state.amount+=k}updateAmountDisplay()}
$('keypad').addEventListener('click',e=>{const b=e.target.closest('.key');if(!b)return;handleKey(b.dataset.key)});
$('currencyRow').addEventListener('click',e=>{const b=e.target.closest('.cur-pill');if(!b)return;const nc=b.dataset.currency;if(nc===state.currency)return;const a=getNumericAmount();if(a>0){const ils=toIls(a,state.currency),na=fromIls(ils,nc);state.amount=nc==='THB'?String(Math.round(na)):String(Math.round(na*100)/100)}state.currency=nc;document.querySelectorAll('.cur-pill').forEach(p=>p.classList.remove('active'));b.classList.add('active');updateAmountDisplay()});
$('categories').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));b.classList.add('active');state.category=b.dataset.cat;updateLaunchState()});
descInput.addEventListener('input',e=>{state.description=e.target.value});
function formatDateForDisplay(iso){const d=new Date(iso+'T00:00:00'),days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'],dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=String(d.getFullYear()).slice(2);return days[d.getDay()]+' • '+dd+'/'+mm+'/'+yy}
function setDate(iso){state.date=iso;dateInput.value=iso;dateDisplay.textContent=formatDateForDisplay(iso)}
dateWrap.addEventListener('click',()=>{if(dateInput.showPicker)dateInput.showPicker();else dateInput.click()});
dateInput.addEventListener('change',e=>{if(e.target.value)setDate(e.target.value)});
function updateLaunchState(){launchBtn.disabled=!(getNumericAmount()>0&&state.category)}
let toastTimer;function showToast(m,t){toast.textContent=m;toast.className='toast show '+(t||'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),3500)}

launchBtn.addEventListener('click',async()=>{
  const amount=getNumericAmount();
  if(!amount||!state.category)return;
  if(!state.settings.webhookUrl){showToast('הגדר תחילה Apps Script URL','error');openSettings();return}
  const payload={date:state.date,category:state.category,description:state.description||'',amount:amount,currency:state.currency,rates:state.settings.rates};
  launchBtn.disabled=true;
  const orig=launchBtn.innerHTML;
  launchBtn.innerHTML='<span>שולח...</span>';
  try{
    const dataParam=encodeURIComponent(JSON.stringify(payload));
    const sep=state.settings.webhookUrl.includes('?')?'&':'?';
    const url=state.settings.webhookUrl+sep+'data='+dataParam;
    const response=await fetch(url,{method:'GET',redirect:'follow'});
    const text=await response.text();
    const result=JSON.parse(text);
    if(!result.ok)throw new Error(result.error||'שגיאה');
    showToast('✓ ההוצאה נשלחה לטבלה','success');
    state.amount='';state.category=null;state.description='';descInput.value='';
    document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
    updateAmountDisplay();
    if(navigator.vibrate)navigator.vibrate(50);
  }catch(err){
    showToast('שגיאה: '+(err.message||err),'error');
  }finally{
    launchBtn.innerHTML=orig;
    updateLaunchState();
  }
});

function openSettings(){$('webhookInput').value=state.settings.webhookUrl||'';$('rateThbIls').value=state.settings.rates.THB_ILS;$('rateUsdIls').value=state.settings.rates.USD_ILS;$('rateEurIls').value=state.settings.rates.EUR_ILS;settingsModal.classList.add('show')}
function closeSettings(){settingsModal.classList.remove('show')}
$('settingsLink').addEventListener('click',e=>{e.preventDefault();openSettings()});
settingsModal.addEventListener('click',e=>{if(e.target===settingsModal)closeSettings()});
$('saveSettings').addEventListener('click',()=>{state.settings.webhookUrl=$('webhookInput').value.trim();const t=parseFloat($('rateThbIls').value),u=parseFloat($('rateUsdIls').value),r=parseFloat($('rateEurIls').value);if(t>0)state.settings.rates.THB_ILS=t;if(u>0)state.settings.rates.USD_ILS=u;if(r>0)state.settings.rates.EUR_ILS=r;saveSettingsToStorage();updateAmountDisplay();closeSettings();showToast('ההגדרות נשמרו','success')});

loadSettings();setDate(state.date);updateAmountDisplay();
</script>
</body>
</html>
